spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            websocket:
              # Default de Reactor Netty (65536) -- el historial inicial de
              # /ws/candles para D1 pesa mas que eso por simbolo (mas cifras
              # decimales por barra que M1/M5/etc, confirmado en vivo: 66184
              # bytes vs ~52000 de los demas timeframes), asi que el proxy
              # cortaba la conexion a mitad del frame antes de que el
              # suscriptor llegara a registrarse -- el cliente veia un ciclo
              # infinito de reconexion solo con D1.
              max-frame-payload-length: 1048576
          routes:
            - id: auth-service
              uri: lb://auth-service
              order: -1
              predicates:
                - Path=/auth/**
              filters:
                - AddRequestHeader=X-Gateway-Passed,true
            - id: scanner-management-service
              uri: lb://scanner-management-service
              predicates:
                - Path=/escaner/**
              filters:
                - AddRequestHeader=X-Gateway-Passed,true
                - JwtAuthenticationFilter
            - id: marketdata-symbols-viewer
              uri: lb://marketdata-service
              order: -1
              predicates:
                - Path=/marketdata/symbols,/marketdata/symbols/**,/marketdata/markets,/marketdata/timeframes
              filters:
                - AddRequestHeader=X-Gateway-Passed,true
                - JwtAuthenticationFilter
              metadata:
                response-timeout: 120000
                connect-timeout: 10000
            - id: marketdata-candles-websocket-viewer
              uri: lb://marketdata-service
              order: -1
              predicates:
                - Path=/ws/candles
              filters:
                - AddRequestHeader=X-Gateway-Passed,true
                - JwtAuthenticationFilter
            - id: marketdata-service
              uri: lb://marketdata-service
              predicates:
                - Path=/marketdata/**,/test/**
              filters:
                - AddRequestHeader=X-Gateway-Passed,true
                - JwtAuthenticationFilter
              metadata:
                response-timeout: 120000
                connect-timeout: 10000
            - id: marketdata-websocket
              uri: lb://marketdata-service
              predicates:
                - Path=/ws/**
              filters:
                - AddRequestHeader=X-Gateway-Passed,true
                - JwtAuthenticationFilter
            - id: asset-management-service
              uri: lb://asset-management-service
              predicates:
                - Path=/activos/**
              filters:
                - AddRequestHeader=X-Gateway-Passed,true
                - JwtAuthenticationFilter
            - id: log-service
              uri: lb://log-service
              predicates:
                - Path=/logs/**
              filters:
                - AddRequestHeader=X-Gateway-Passed,true
                - JwtAuthenticationFilter
            - id: notification-service-en
              uri: lb://notification-service
              order: 1
              predicates:
                - Path=/notifications/**
              filters:
                - RewritePath=/notifications/(?<path>.*), /notificaciones/${path}
                - AddRequestHeader=X-Gateway-Passed,true
                - JwtAuthenticationFilter
                - AddResponseHeader=X-Accel-Buffering,no
                - AddResponseHeader=Cache-Control,no-cache
              metadata:
                response-timeout: -1
                connect-timeout: 10000
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/notificaciones/**
              filters:
                - AddRequestHeader=X-Gateway-Passed,true
                - JwtAuthenticationFilter
                - AddResponseHeader=X-Accel-Buffering,no
                - AddResponseHeader=Cache-Control,no-cache
              metadata:
                response-timeout: -1
                connect-timeout: 10000
          # signal-processing-service NO está expuesto en el gateway.
          # Se comunica exclusivamente dentro de la red Docker:
          #   - scanner-management → signal-processing (REST interno)
          #   - signal-processing → scanner-management (REST interno)
          #   - ambos ↔ Kafka (red interna)
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

  profiles:
    active: prod

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    "[com.netflix.discovery.shared.resolver.aws.ConfigClusterResolver]": WARN
    "[com.netflix.discovery]": WARN

server:
  port: 8080
  netty:
    # Las conexiones SSE reciben heartbeats cada 30s, por lo que nunca alcanzan
    # este timeout. Las conexiones HTTP inactivas se limpian tras 5 minutos.
    idle-timeout: 300s

# Configuración del rate limiting del gateway
gateway:
  rate-limit:
    habilitado: false
    limite-peticiones-por-minuto: 120
    umbral-baneo-automatico: 300
    duracion-baneo-minutos: 10
    expiracion-bucket-minutos: 15
    maximo-ips-en-cache: 50000

# Actuator for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      show-details: always
