name: CD Metradingplat Gateway

on:
  workflow_run:
    workflows: ["CI Metradingplat Gateway"]
    types:
      - completed

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Acquire exclusive deploy lock (avoid overwhelming the shared host)
        run: |
          LOCK_DIR="/tmp/metradingplat-deploy.lock"
          MAX_WAIT=2400
          MAX_LOCK_AGE=1800
          waited=0
          while ! mkdir "$LOCK_DIR" 2>/dev/null; do
            lock_age=$(( $(date +%s) - $(stat -c %Y "$LOCK_DIR" 2>/dev/null || date +%s) ))
            if [ "$lock_age" -gt "$MAX_LOCK_AGE" ]; then
              echo "Lock abandonado hace ${lock_age}s (el dueno probablemente murio) -- liberando y tomando control"
              rm -rf "$LOCK_DIR"
              continue
            fi
            if [ "$waited" -ge "$MAX_WAIT" ]; then
              echo "Timeout esperando el lock de deploy compartido"
              exit 1
            fi
            echo "Otro deploy de MeTradingPlat esta en curso, esperando... (${waited}s/${MAX_WAIT}s)"
            sleep 10
            waited=$((waited + 10))
          done
          echo "${{ github.repository }}" > "$LOCK_DIR/owner"
          echo "Lock de deploy adquirido"

      - name: Create Docker Network
        run: |
          docker network create metradingplat-network || echo "Network already exists"

          echo "--- CLEANING SERVICE METADATA ---"
          docker rm -f gateway || true
          docker image rm -f virtud142/metradingplat_gateway:latest || true

      - name: Pull Docker Image (with Retry Logic)
        run: |
          echo "Attempting to pull image with auto-retry for stability..."
          for i in 1 2 3 4 5; do
            docker pull virtud142/metradingplat_gateway:latest && exit 0 || \
            (echo "Attempt $i failed, waiting $((i * 15))s..." && sleep $((i * 15)))
          done
          echo "All pull attempts failed. Docker daemon might need a manual restart."
          exit 1

      - name: Delete Old Docker Container
        run: docker rm -f gateway || true

      - name: Run Docker Container with Network
        run: |
          docker run -d \
            -p 8080:8080 \
            --name "gateway" \
            --network "metradingplat-network" \
            --restart "unless-stopped" \
            --cpus "0.5" \
            --memory "384m" \
            --memory-swap "384m" \
            --label project="metradingplat" \
            --label service="gateway" \
            -e SPRING_PROFILES_ACTIVE="prod" \
            -e EUREKA_HOST="directory" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            virtud142/metradingplat_gateway:latest

      - name: Clean Old Images of This Service
        run: |
          echo "Cleaning old images for gateway service..."
          CURRENT_IMAGE=$(docker inspect gateway --format='{{.Image}}' 2>/dev/null || echo "")
          if [ -n "$CURRENT_IMAGE" ]; then
            docker images --filter "label=service=gateway" --format "{{.ID}}" | while read img; do
              if [ "$img" != "${CURRENT_IMAGE:7:12}" ]; then
                echo "Removing old image: $img"
                docker rmi -f $img 2>/dev/null || true
              fi
            done
          fi
          docker images virtud142/metradingplat_gateway --format "{{.ID}} {{.Tag}}" | grep -v "latest" | awk '{print $1}' | xargs -r docker rmi -f 2>/dev/null || true

      - name: Clean Stopped Containers of This Service
        run: |
          echo "Cleaning stopped containers for gateway service..."
          docker ps -a --filter "label=service=gateway" --filter "status=exited" -q | xargs -r docker rm 2>/dev/null || true

      - name: Final Status Check
        run: |
          sleep 5
          docker ps | grep gateway

      - name: Release exclusive deploy lock
        if: always()
        run: |
          LOCK_DIR="/tmp/metradingplat-deploy.lock"
          if [ -f "$LOCK_DIR/owner" ] && [ "$(cat "$LOCK_DIR/owner")" = "${{ github.repository }}" ]; then
            rm -rf "$LOCK_DIR"
          fi
